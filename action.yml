name: Insomnia Run
description: Run Insomnia Collections & Tests using the Inso CLI with PR comment reporting.
author: Sourab Kanthavar <@scarowar>

branding:
  icon: terminal
  color: purple

inputs:
  execution-timeout:
    description: "Timeout for entire execution in seconds. Default is 300. Increase for large collections or slow APIs."
    required: false
    default: "300"
  command:
    description: 'The command to run: "test" or "collection".'
    required: true

  working-directory:
    description: "Path to Insomnia export file or .insomnia directory."
    required: true

  github-token:
    description: "GitHub token for posting PR comments. Uses GITHUB_TOKEN if not provided."
    required: false

  comment-issue-number:
    description: "Issue or pull request number to comment on. Required for comments outside pull_request workflows."
    required: false

  inso-version:
    description: "Version of Inso CLI to use."
    required: false
    default: "12.6.0"

  identifier:
    description: "Collection name, test suite name, or workspace ID to run."
    required: false
  environment:
    description: "Insomnia environment name to use."
    required: false

  request-name-pattern:
    description: "Regex pattern to filter requests by name (collection only)."
    required: false
  item:
    description: "Specific request or folder IDs to run, comma-separated."
    required: false
  globals:
    description: "Path to global environment file or ID."
    required: false
  delay-request:
    description: "Delay between requests in milliseconds."
    required: false
  iteration-count:
    description: "Number of times to iterate through the collection."
    required: false
  iteration-data:
    description: "Path to CSV or JSON data file for iterations."
    required: false
  env-var:
    description: "Environment variables in KEY=VALUE format, one per line."
    required: false

  test-name-pattern:
    description: "Regex pattern to filter tests by name (test only)."
    required: false
  keep-file:
    description: "Keep the generated test file after execution."
    required: false
    default: "false"

  bail:
    description: "Stop execution on first failure."
    required: false
    default: "false"
  request-timeout:
    description: "Request timeout in milliseconds."
    required: false
  disable-cert-validation:
    description: "Disable SSL certificate validation."
    required: false
    default: "false"
  https-proxy:
    description: "HTTPS proxy URL."
    required: false
  http-proxy:
    description: "HTTP proxy URL."
    required: false
  no-proxy:
    description: "Comma-separated list of hosts to bypass proxy."
    required: false
  data-folders:
    description: "Folders that Insomnia can access for file references."
    required: false
  verbose:
    description: "Enable verbose logging."
    required: false
    default: "false"
  output-format:
    description: "The format of the report output (e.g., 'json')."
    required: false
  include-raw-output:
    description: "Include raw Inso output in the generated Markdown report."
    required: false
    default: "false"
  junit-report:
    description: "Generate a JUnit XML report file."
    required: false
    default: "true"
  junit-output-file:
    description: "Path for the JUnit XML report. Defaults to a file under RUNNER_TEMP."
    required: false

  pr-comment:
    description: "Post test results as a PR comment."
    required: false
    default: "true"
  fail-on-error:
    description: "Fail the workflow if tests fail."
    required: false
    default: "true"

outputs:
  markdown:
    value: ${{ steps.run-cli.outputs.markdown }}
  json-output:
    value: ${{ steps.run-cli.outputs.json-output }}
  junit-file:
    value: ${{ steps.run-cli.outputs.junit-file }}
  exit-code:
    value: ${{ steps.run-cli.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Detect Inso CLI
      id: detect-inso
      shell: bash
      run: |
        set -euo pipefail
        if command -v inso &> /dev/null; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Using preinstalled Inso CLI"
          inso --version
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Inso CLI
      if: steps.detect-inso.outputs.found != 'true'
      uses: Kong/setup-inso@33b1006a5c2ae15364fc18146ec900b7db3c675e # v2.1.0
      with:
        inso-version: ${{ inputs.inso-version }}

    - name: Verify Inso CLI
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v inso &> /dev/null; then
          echo "::error::Inso CLI was not found in PATH"
          echo "::error::Install Inso on the runner or allow Kong/setup-inso to install it"
          exit 1
        fi
        inso --version

    - name: Verify Python Requirements
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v python3 &> /dev/null; then
          echo "::error::Python 3 is not installed or not in PATH"
          echo "::error::insomnia-run requires Python 3.10 or higher"
          echo "::error::GitHub-hosted runners have Python pre-installed. If using a self-hosted runner, please install Python 3.10+."
          exit 1
        fi

        python3 - <<'EOF'
        import sys
        if sys.version_info < (3, 10):
            print("::error::insomnia-run requires Python 3.10 or higher")
            print(f"::error::Current version: {sys.version}")
            print("::error::GitHub-hosted runners provide Python 3.10+. Consider using a newer runner image or upgrading Python.")
            sys.exit(1)
        print(f"Using Python {sys.version.split()[0]}")
        EOF

    - name: Install insomnia-run
      shell: bash
      run: |
        set -euo pipefail
        VENV_DIR="${RUNNER_TEMP}/insomnia-run-venv"
        if ! python3 -m venv "$VENV_DIR"; then
          echo "::error::Failed to create a Python virtual environment"
          echo "::error::Install the Python venv module on this runner and try again"
          exit 1
        fi
        if ! "${VENV_DIR}/bin/python" -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"; then
          echo "::error::Failed to install insomnia-run"
          echo "::error::Check Python package index access or configure pip for this runner"
          exit 1
        fi

    - name: Run Insomnia
      id: run-cli
      shell: bash
      env:
        EXECUTION_TIMEOUT: ${{ inputs.execution-timeout }}
        COMMAND: ${{ inputs.command }}
        WORKING_DIR: ${{ inputs.working-directory }}
        IDENTIFIER: ${{ inputs.identifier }}
        ENVIRONMENT: ${{ inputs.environment }}

        REQUEST_NAME_PATTERN: ${{ inputs.request-name-pattern }}
        ITEM: ${{ inputs.item }}
        GLOBALS: ${{ inputs.globals }}
        DELAY_REQUEST: ${{ inputs.delay-request }}
        ITERATION_COUNT: ${{ inputs.iteration-count }}
        ITERATION_DATA: ${{ inputs.iteration-data }}
        ENV_VAR: ${{ inputs.env-var }}

        TEST_NAME_PATTERN: ${{ inputs.test-name-pattern }}
        KEEP_FILE: ${{ inputs.keep-file }}

        BAIL: ${{ inputs.bail }}
        REQUEST_TIMEOUT: ${{ inputs.request-timeout }}
        DISABLE_CERT_VALIDATION: ${{ inputs.disable-cert-validation }}

        HTTPS_PROXY: ${{ inputs.https-proxy }}
        HTTP_PROXY: ${{ inputs.http-proxy }}
        NO_PROXY: ${{ inputs.no-proxy }}
        DATA_FOLDERS: ${{ inputs.data-folders }}
        VERBOSE: ${{ inputs.verbose }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}
        INCLUDE_RAW_OUTPUT: ${{ inputs.include-raw-output }}
        JUNIT_REPORT: ${{ inputs.junit-report }}
        JUNIT_OUTPUT_FILE: ${{ inputs.junit-output-file }}

        WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      run: |
        set +e

        INSOMNIA_RUN_BIN="${RUNNER_TEMP}/insomnia-run-venv/bin/insomnia-run"

        if [[ ! -x "$INSOMNIA_RUN_BIN" ]]; then
          echo "::error::insomnia-run command not found after installation"
          echo "::error::This may indicate an installation issue. Please report this at https://github.com/scarowar/insomnia-run/issues"
          exit 1
        fi

        if [[ "$COMMAND" != "collection" && "$COMMAND" != "test" ]]; then
          echo "::error::Invalid command '$COMMAND'. Must be 'collection' or 'test'."
          exit 1
        fi

        if [[ "$COMMAND" == "collection" ]]; then
          CMD=("$INSOMNIA_RUN_BIN" run-collection)
        else
          CMD=("$INSOMNIA_RUN_BIN" run-test)
        fi

        CMD+=(--working-dir "$WORKING_DIR")

        # Add execution-timeout if set
        if [[ -n "$EXECUTION_TIMEOUT" ]]; then
          CMD+=(--execution-timeout "$EXECUTION_TIMEOUT")
        fi

        [[ -n "$OUTPUT_FORMAT" ]] && CMD+=(--output-format "$OUTPUT_FORMAT")

        [[ -n "$IDENTIFIER" ]] && CMD+=(--identifier "$IDENTIFIER")
        [[ -n "$ENVIRONMENT" ]] && CMD+=(--env "$ENVIRONMENT")

        if [[ "$COMMAND" == "collection" ]]; then
          [[ -n "$REQUEST_NAME_PATTERN" ]] && CMD+=(--request-name-pattern "$REQUEST_NAME_PATTERN")
          [[ -n "$GLOBALS" ]] && CMD+=(--globals "$GLOBALS")
          [[ -n "$DELAY_REQUEST" ]] && CMD+=(--delay-request "$DELAY_REQUEST")
          [[ -n "$ITERATION_COUNT" ]] && CMD+=(--iteration-count "$ITERATION_COUNT")
          [[ -n "$ITERATION_DATA" ]] && CMD+=(--iteration-data "$ITERATION_DATA")

          if [[ -n "$ITEM" ]]; then
            IFS=',' read -ra ITEMS <<< "$ITEM"
            for i in "${ITEMS[@]}"; do
              i="$(echo "$i" | xargs)"
              CMD+=(--item "$i")
            done
          fi

          if [[ -n "$ENV_VAR" ]]; then
            while IFS= read -r line; do
              [[ -n "$line" ]] && CMD+=(--env-var "$line")
            done <<< "$ENV_VAR"
          fi
        fi

        if [[ "$COMMAND" == "test" ]]; then
          [[ -n "$TEST_NAME_PATTERN" ]] && CMD+=(--test-name-pattern "$TEST_NAME_PATTERN")
          [[ "$KEEP_FILE" == "true" ]] && CMD+=(--keep-file)
        fi

        [[ "$BAIL" == "true" ]] && CMD+=(--bail)
        [[ -n "$REQUEST_TIMEOUT" ]] && CMD+=(--request-timeout "$REQUEST_TIMEOUT")
        [[ "$DISABLE_CERT_VALIDATION" == "true" ]] && CMD+=(--disable-cert-validation)
        [[ -n "$HTTPS_PROXY" ]] && CMD+=(--https-proxy "$HTTPS_PROXY")
        [[ -n "$HTTP_PROXY" ]] && CMD+=(--http-proxy "$HTTP_PROXY")
        [[ -n "$NO_PROXY" ]] && CMD+=(--no-proxy "$NO_PROXY")
        [[ "$VERBOSE" == "true" ]] && CMD+=(--verbose)

        if [[ -n "$DATA_FOLDERS" ]]; then
          IFS=',' read -ra FOLDERS <<< "$DATA_FOLDERS"
          for f in "${FOLDERS[@]}"; do
            CMD+=(--data-folders "$f")
          done
        fi

        CMD+=(--workflow-url "$WORKFLOW_URL")
        [[ "$INCLUDE_RAW_OUTPUT" == "true" ]] && CMD+=(--include-raw-output)

        JUNIT_FILE=""
        if [[ "$JUNIT_REPORT" == "true" ]]; then
          if [[ -n "$JUNIT_OUTPUT_FILE" ]]; then
            JUNIT_FILE="$JUNIT_OUTPUT_FILE"
          else
            JUNIT_FILE="${RUNNER_TEMP}/insomnia-run-junit.xml"
          fi
          CMD+=(--junit-output "$JUNIT_FILE")
        fi

        echo "::group::Running Insomnia"
        echo "Executing insomnia-run for command '$COMMAND'"

        OUTPUT_FORMAT_LOWER=$(echo "$OUTPUT_FORMAT" | tr '[:upper:]' '[:lower:]')

        if [[ "$OUTPUT_FORMAT_LOWER" == "json" ]]; then
          JSON_TMPFILE=$(mktemp)
          MARKDOWN="$("${CMD[@]}" 2>"$JSON_TMPFILE")"
          EXIT_CODE=$?
          JSON_OUTPUT=$(cat "$JSON_TMPFILE")
          rm -f "$JSON_TMPFILE"
        else
          MARKDOWN="$("${CMD[@]}" 2>&1)"
          EXIT_CODE=$?
          JSON_OUTPUT=""
        fi
        echo "::endgroup::"

        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        if [[ -n "$JUNIT_FILE" && -f "$JUNIT_FILE" ]]; then
          echo "junit-file=$JUNIT_FILE" >> "$GITHUB_OUTPUT"
        else
          echo "junit-file=" >> "$GITHUB_OUTPUT"
        fi

        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        {
          echo "markdown<<$EOF"
          echo "$MARKDOWN"
          echo "$EOF"
        } >> "$GITHUB_OUTPUT"

        if [[ -n "$JSON_OUTPUT" ]]; then
          EOF_JSON=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "json-output<<$EOF_JSON"
            echo "$JSON_OUTPUT"
            echo "$EOF_JSON"
          } >> "$GITHUB_OUTPUT"
        fi

        echo "$MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - name: Post PR Comment
      if: inputs.pr-comment == 'true' && (github.event_name == 'pull_request' || inputs.comment-issue-number != '')
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        token: ${{ inputs.github-token || github.token }}
        issue-number: ${{ inputs.comment-issue-number || github.event.pull_request.number }}
        body: ${{ steps.run-cli.outputs.markdown }}

    - name: Check for Failures
      if: inputs.fail-on-error == 'true' && steps.run-cli.outputs.exit-code != '0'
      shell: bash
      run: |
        echo "::error::Tests failed. See the report above for details."
        exit 1
