name: Insomnia Run
description: Run Insomnia Collections & Tests using the Inso CLI with PR comment reporting.
author: Sourab Kanthavar <@scarowar>

branding:
  icon: terminal
  color: purple

inputs:
  command:
    description: 'The command to run: "test" or "collection".'
    required: true

  working-directory:
    description: "Path to Insomnia export file or .insomnia directory."
    required: true

  identifier:
    description: "Collection name, test suite name, or workspace ID to run."
    required: false
  environment:
    description: "Insomnia environment name to use."
    required: false

  request-name-pattern:
    description: "Regex pattern to filter requests by name (collection only)."
    required: false
  item:
    description: "Specific request or folder IDs to run, comma-separated."
    required: false
  globals:
    description: "Path to global environment file or ID."
    required: false
  delay-request:
    description: "Delay between requests in milliseconds."
    required: false
  iteration-count:
    description: "Number of times to iterate through the collection."
    required: false
  iteration-data:
    description: "Path to CSV or JSON data file for iterations."
    required: false
  env-var:
    description: "Environment variables in KEY=VALUE format, one per line."
    required: false

  test-name-pattern:
    description: "Regex pattern to filter tests by name (test only)."
    required: false
  keep-file:
    description: "Keep the generated test file after execution."
    required: false
    default: "false"

  bail:
    description: "Stop execution on first failure."
    required: false
    default: "false"
  request-timeout:
    description: "Request timeout in milliseconds."
    required: false
  disable-cert-validation:
    description: "Disable SSL certificate validation."
    required: false
    default: "false"
  https-proxy:
    description: "HTTPS proxy URL."
    required: false
  http-proxy:
    description: "HTTP proxy URL."
    required: false
  no-proxy:
    description: "Comma-separated list of hosts to bypass proxy."
    required: false
  data-folders:
    description: "Folders that Insomnia can access for file references."
    required: false
  verbose:
    description: "Enable verbose logging."
    required: false
    default: "false"
  output-format:
    description: "The format of the report output (e.g., 'json')."
    required: false

  execution-timeout:
    description: "Timeout for entire execution in seconds. Default is 300. Increase for large collections or slow APIs."
    required: false
    default: "300"

  inso-version:
    description: "Exact Inso CLI version to use (semver, e.g. 13.2.0)."
    required: false
    default: "13.2.0"

  github-token:
    description: "GitHub token for PR comments and release-asset downloads on private/enterprise hosts. Uses GITHUB_TOKEN if not provided."
    required: false

  pr-comment:
    description: "Post test results as a PR comment."
    required: false
    default: "true"
  comment-tag:
    description: "Tag used to find and update the existing PR comment instead of posting duplicates."
    required: false
    default: "insomnia-run-report"

  fail-on-error:
    description: "Fail the workflow if tests fail."
    required: false
    default: "true"

  include-raw-output:
    description: "Embed the (redacted) raw Inso output in the markdown report."
    required: false
    default: "true"
  raw-output-max-bytes:
    description: "Maximum raw output size embedded in the markdown report."
    required: false
    default: "8192"
  junit-output:
    description: "Path to write a JUnit XML report (enabled when set)."
    required: false
    default: ""
  upload-report:
    description: "Upload the JUnit report, markdown report, and full raw output as a workflow artifact."
    required: false
    default: "false"
  report-artifact-name:
    description: "Artifact name used when upload-report is true."
    required: false
    default: "insomnia-run-report"

outputs:
  markdown:
    value: ${{ steps.run-cli.outputs.markdown }}
  json-output:
    value: ${{ steps.run-cli.outputs.json-output }}
  exit-code:
    value: ${{ steps.run-cli.outputs.exit-code }}
  junit-path:
    value: ${{ steps.run-cli.outputs.junit-path }}

runs:
  using: composite
  steps:
    - name: 🧰 Validate prerequisites and Inso version
      shell: bash
      env:
        INSO_VERSION: ${{ inputs.inso-version }}
      run: |
        set -euo pipefail
        MISSING=""
        for tool in python3 curl tar xz jq; do
          command -v "$tool" >/dev/null 2>&1 || MISSING="$MISSING $tool"
        done
        if [[ -n "$MISSING" ]]; then
          echo "::error::Missing required runner tools:$MISSING. Install them (e.g. apt-get install python3-venv curl tar xz-utils jq) and re-run."
          exit 1
        fi
        # CR/LF stripped so untrusted input cannot inject workflow commands
        SAFE_VERSION="${INSO_VERSION//[$'\r\n']/}"
        if [[ ! "$SAFE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid inso-version '$SAFE_VERSION'. Provide an exact semver (e.g. 13.2.0)."
          exit 1
        fi

    - name: 🔍 Detect preinstalled Inso
      id: detect-inso
      shell: bash
      env:
        INSO_VERSION: ${{ inputs.inso-version }}
      run: |
        if command -v inso >/dev/null 2>&1; then
          RAW_VER="$(inso --version 2>/dev/null || true)"
          VER_TOKEN="$(printf '%s' "$RAW_VER" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          if [[ "$VER_TOKEN" == "$INSO_VERSION" && "$RAW_VER" != *"$INSO_VERSION"-* && "$RAW_VER" != *"$INSO_VERSION".* ]]; then
            echo "needs-setup=false" >> "$GITHUB_OUTPUT"
            echo "Preinstalled Inso ${INSO_VERSION} found; skipping installation."
            exit 0
          fi
        fi
        echo "needs-setup=true" >> "$GITHUB_OUTPUT"

    - name: 🧰 Install Inso CLI
      if: steps.detect-inso.outputs.needs-setup == 'true'
      shell: bash
      env:
        INSO_VERSION: ${{ inputs.inso-version }}
        RUNNER_OS_: ${{ runner.os }}
      run: | # zizmor: ignore[github-env] (PATH value is runner-controlled)
        set -euo pipefail

        if [[ "$RUNNER_OS_" != "Linux" ]]; then
          echo "::error::insomnia-run supports Linux runners (runner OS: ${RUNNER_OS_}). See the docs for alternatives."
          exit 1
        fi

        if [[ "$(uname -m)" != "x86_64" ]]; then
          echo "::error::Unsupported runner architecture: $(uname -m). Kong publishes Inso CLI binaries for Linux x64 only (no arm64 assets upstream); run this action on an x86_64 runner."
          exit 1
        fi

        ASSET="inso-linux-x64-${INSO_VERSION}.tar.xz"
        URL="https://github.com/Kong/insomnia/releases/download/core%40${INSO_VERSION}/${ASSET}"
        echo "Downloading ${URL}"
        if ! curl -sSL --fail --retry 3 --max-time 180 -o "${RUNNER_TEMP}/${ASSET}" "$URL"; then
          echo "::error::Could not download Inso CLI ${INSO_VERSION} (${ASSET}). Check that the version exists at https://github.com/Kong/insomnia/releases and that the runner has network egress."
          exit 1
        fi

        # Pinned digests for versions whose integrity this action release has
        # verified. Unmapped versions proceed with a warning (Kong publishes
        # no checksum manifest upstream).
        case "${INSO_VERSION}" in
          13.2.0) EXPECTED_SHA256="b72c723bdbc5dc721cf364e7e654930471993391468651f9e45b93a00eb4c0ab" ;;
          13.1.0) EXPECTED_SHA256="f41f0cc4a751aaf82df093b172b07672e61133fd675e4cf55a83ede2a579d4b1" ;;
          *) EXPECTED_SHA256="" ;;
        esac
        ACTUAL_SHA256="$(sha256sum "${RUNNER_TEMP}/${ASSET}" | cut -d' ' -f1)"
        if [[ -n "$EXPECTED_SHA256" && "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
          echo "::error::Inso tarball checksum mismatch for ${INSO_VERSION}: expected ${EXPECTED_SHA256}, got ${ACTUAL_SHA256}. Do not retry blindly; investigate."
          exit 1
        fi
        if [[ -z "$EXPECTED_SHA256" ]]; then
          echo "::warning::No pinned checksum for Inso ${INSO_VERSION} in this action version; proceeding without upstream integrity verification (got ${ACTUAL_SHA256})."
        fi

        mkdir -p "${RUNNER_TEMP}/inso"
        tar -xJf "${RUNNER_TEMP}/${ASSET}" -C "${RUNNER_TEMP}/inso"
        BIN_DIR="${RUNNER_TEMP}/inso"
        chmod +x "${BIN_DIR}/inso"
        echo "${BIN_DIR}" >> "$GITHUB_PATH"

    - name: ✅ Verify Inso CLI
      shell: bash
      env:
        INSO_VERSION: ${{ inputs.inso-version }}
      run: |
        set -euo pipefail
        echo "INSO_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
        if ! command -v inso >/dev/null 2>&1; then
          echo "::error::Inso CLI is not available on PATH after installation. Please report this at https://github.com/scarowar/insomnia-run/issues"
          exit 1
        fi
        RAW_VER="$(inso --version 2>/dev/null || echo 'unknown')"
        VER_TOKEN="$(printf '%s' "$RAW_VER" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
        if [[ "$VER_TOKEN" != "$INSO_VERSION" || "$RAW_VER" == *"$INSO_VERSION"-* || "$RAW_VER" == *"$INSO_VERSION".* ]]; then
          echo "::error::Inso CLI version mismatch: expected ${INSO_VERSION}, got '${RAW_VER}'."
          exit 1
        fi

    - name: 📦 Install insomnia-run runtime
      id: runtime
      shell: bash # zizmor: ignore[github-env] (PATH value is runner-controlled)
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        ACTION_REF: ${{ github.action_ref }}
      run: | # zizmor: ignore[github-env] (PATH value is runner-controlled)
        set -euo pipefail

        VENV="${RUNNER_TEMP}/insomnia-run-venv"
        python3 -m venv --clear "$VENV"
        echo "${VENV}/bin" >> "$GITHUB_PATH"

        if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          TAG="$ACTION_REF"
          VERSION="${TAG#v}"
          WHEEL="insomnia_run-${VERSION}-py3-none-any.whl"
          BASE="${GITHUB_SERVER_URL}/${ACTION_REPOSITORY}/releases/download/${TAG}"
          STAGE="${RUNNER_TEMP}/insomnia-run-assets"
          mkdir -p "$STAGE"

          download() {
            # $1 = asset name; try anonymous CDN first, then authenticated API fallback
            # whenever a token is available (fixes private internal mirrors on github.com).
            local asset="$1" dest="$2"
            if curl -sSL --fail --retry 3 --max-time 300 -o "$dest" "${BASE}/${asset}"; then
              return 0
            fi
            if [[ -z "$GITHUB_TOKEN" ]]; then
              return 1
            fi
            local asset_url
            asset_url="$(curl -sSL --fail --retry 3 --max-time 120 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "${GITHUB_API_URL}/repos/${ACTION_REPOSITORY}/releases/tags/${TAG}" \
              | jq -r ".assets[] | select(.name==\"${asset}\") | .url")"
            [[ -n "$asset_url" && "$asset_url" != "null" ]] || return 1
            # Two-step download so Authorization is not forwarded to S3/CDN redirect target
            REDIR="$(curl -sS -D - -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/octet-stream" -o /dev/null "$asset_url" 2>/dev/null | tr -d '\r' | awk '/^location:/I{print $2}' | tail -1 | tr -d '\n\r ')"
            if [[ -n "$REDIR" ]]; then
              curl -sSL --fail --retry 3 --max-time 300 -o "$dest" "$REDIR"
            else
              curl -sSL --fail --retry 3 --max-time 300 \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/octet-stream" \
                -o "$dest" "$asset_url"
            fi
          }

          RELEASE_JSON="$(curl -sS --fail --retry 3 --max-time 120 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${GITHUB_API_URL}/repos/${ACTION_REPOSITORY}/releases/tags/${TAG}")" || {
            echo "::error::Could not read release ${TAG} (missing or token lacks contents:read on ${ACTION_REPOSITORY}). If the action repo is mirrored privately, pass a github-token with contents:read on the mirror repo."
            exit 1
          }
          for asset in "$WHEEL" "SHA256SUMS" "constraints.txt"; do
            ASSET_ID="$(printf '%s' "$RELEASE_JSON" | jq -r ".assets[] | select(.name==\"${asset}\") | .id")"
            if [[ -z "$ASSET_ID" || "$ASSET_ID" == "null" ]]; then
              echo "::error::Release asset '${asset}' not found on release ${TAG} (checked assets: $(printf '%s' "$RELEASE_JSON" | jq -r '.assets[].name' | tr '\n' ' ')). The release workflow attaches the wheel, SHA256SUMS, and constraints.txt automatically; re-run the release."
              exit 1
            fi
            if ! download "$asset" "${STAGE}/${asset}"; then
              echo "::error::Could not download '${asset}' from release ${TAG} (asset id ${ASSET_ID}). Check runner egress and the token scope, then retry."
              exit 1
            fi
          done

          (cd "$STAGE" && sha256sum --check --strict SHA256SUMS) || {
            echo "::error::Checksum verification failed for release ${TAG} assets. Do not retry blindly; investigate."
            exit 1
          }

          "${VENV}/bin/python" -m pip install --quiet --disable-pip-version-check \
            --constraint "${STAGE}/constraints.txt" "${STAGE}/${WHEEL}"
        else
          echo "::warning::insomnia-run is not pinned to an exact vX.Y.Z release (ref: ${ACTION_REF}). Installing from the action source instead; reports may differ from any released version. Pin an exact tag in production."
          "${VENV}/bin/python" -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"
        fi

    - name: 🚀 Run Insomnia
      id: run-cli
      shell: bash
      env:
        EXECUTION_TIMEOUT: ${{ inputs.execution-timeout }}
        COMMAND: ${{ inputs.command }}
        WORKING_DIR: ${{ inputs.working-directory }}
        IDENTIFIER: ${{ inputs.identifier }}
        ENVIRONMENT: ${{ inputs.environment }}

        REQUEST_NAME_PATTERN: ${{ inputs.request-name-pattern }}
        ITEM: ${{ inputs.item }}
        GLOBALS: ${{ inputs.globals }}
        DELAY_REQUEST: ${{ inputs.delay-request }}
        ITERATION_COUNT: ${{ inputs.iteration-count }}
        ITERATION_DATA: ${{ inputs.iteration-data }}
        ENV_VAR: ${{ inputs.env-var }}

        TEST_NAME_PATTERN: ${{ inputs.test-name-pattern }}
        KEEP_FILE: ${{ inputs.keep-file }}

        BAIL: ${{ inputs.bail }}
        REQUEST_TIMEOUT: ${{ inputs.request-timeout }}
        DISABLE_CERT_VALIDATION: ${{ inputs.disable-cert-validation }}

        INPUT_HTTPS_PROXY: ${{ inputs.https-proxy }}
        INPUT_HTTP_PROXY: ${{ inputs.http-proxy }}
        INPUT_NO_PROXY: ${{ inputs.no-proxy }}
        DATA_FOLDERS: ${{ inputs.data-folders }}
        VERBOSE: ${{ inputs.verbose }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}

        INCLUDE_RAW_OUTPUT: ${{ inputs.include-raw-output }}
        RAW_OUTPUT_MAX_BYTES: ${{ inputs.raw-output-max-bytes }}
        JUNIT_OUTPUT: ${{ inputs.junit-output }}
        UPLOAD_REPORT: ${{ inputs.upload-report }}

        WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      run: |
        set +e

        SAFE_COMMAND="${COMMAND//[$'\r\n']/}"
        if [[ "$SAFE_COMMAND" != "collection" && "$SAFE_COMMAND" != "test" ]]; then
          echo "::error::Invalid command '${SAFE_COMMAND}'. Must be 'collection' or 'test'."
          exit 1
        fi

        if [[ "$UPLOAD_REPORT" == "true" ]]; then
          STAGE="${RUNNER_TEMP}/insomnia-run-report"
          mkdir -p "$STAGE"
          JUNIT_PATH="${JUNIT_OUTPUT:-${STAGE}/junit.xml}"
          RAW_FILE="${STAGE}/raw-output.txt"
          REPORT_MD="${STAGE}/report.md"
        else
          JUNIT_PATH="$JUNIT_OUTPUT"
          RAW_FILE=""
          REPORT_MD=""
        fi

        if [[ "$COMMAND" == "collection" ]]; then
          CMD=(insomnia-run run-collection)
        else
          CMD=(insomnia-run run-test)
        fi

        CMD+=(--working-dir "$WORKING_DIR")
        CMD+=(--execution-timeout "$EXECUTION_TIMEOUT")
        [[ "$INCLUDE_RAW_OUTPUT" == "true" ]] && CMD+=(--include-raw-output)
        [[ "$INCLUDE_RAW_OUTPUT" != "true" ]] && CMD+=(--no-include-raw-output)
        CMD+=(--raw-output-max-bytes "$RAW_OUTPUT_MAX_BYTES")

        [[ -n "$OUTPUT_FORMAT" ]] && CMD+=(--output-format "$OUTPUT_FORMAT")
        [[ -n "$JUNIT_PATH" ]] && CMD+=(--junit-output "$JUNIT_PATH")
        [[ -n "$RAW_FILE" ]] && CMD+=(--raw-output-file "$RAW_FILE")

        [[ -n "$IDENTIFIER" ]] && CMD+=(--identifier "$IDENTIFIER")
        [[ -n "$ENVIRONMENT" ]] && CMD+=(--env "$ENVIRONMENT")

        if [[ "$COMMAND" == "collection" ]]; then
          [[ -n "$REQUEST_NAME_PATTERN" ]] && CMD+=(--request-name-pattern "$REQUEST_NAME_PATTERN")
          [[ -n "$GLOBALS" ]] && CMD+=(--globals "$GLOBALS")
          [[ -n "$DELAY_REQUEST" ]] && CMD+=(--delay-request "$DELAY_REQUEST")
          [[ -n "$ITERATION_COUNT" ]] && CMD+=(--iteration-count "$ITERATION_COUNT")
          [[ -n "$ITERATION_DATA" ]] && CMD+=(--iteration-data "$ITERATION_DATA")

          if [[ -n "$ITEM" ]]; then
            IFS=',' read -ra ITEMS <<< "$ITEM"
            for i in "${ITEMS[@]}"; do
              i="${i//[[:space:]]/}"
              [[ -n "$i" ]] && CMD+=(--item "$i")
            done
          fi

          if [[ -n "$ENV_VAR" ]]; then
            while IFS= read -r line; do
              [[ -n "$line" ]] && CMD+=(--env-var "$line")
            done <<< "$ENV_VAR"
          fi
        fi

        if [[ "$COMMAND" == "test" ]]; then
          [[ -n "$TEST_NAME_PATTERN" ]] && CMD+=(--test-name-pattern "$TEST_NAME_PATTERN")
          [[ "$KEEP_FILE" == "true" ]] && CMD+=(--keep-file)
        fi

        [[ "$BAIL" == "true" ]] && CMD+=(--bail)
        [[ -n "$REQUEST_TIMEOUT" ]] && CMD+=(--request-timeout "$REQUEST_TIMEOUT")
        [[ "$DISABLE_CERT_VALIDATION" == "true" ]] && CMD+=(--disable-cert-validation)
        [[ -n "$INPUT_HTTPS_PROXY" ]] && CMD+=(--https-proxy "$INPUT_HTTPS_PROXY")
        [[ -n "$INPUT_HTTP_PROXY" ]] && CMD+=(--http-proxy "$INPUT_HTTP_PROXY")
        [[ -n "$INPUT_NO_PROXY" ]] && CMD+=(--no-proxy "$INPUT_NO_PROXY")

        if [[ -n "$DATA_FOLDERS" ]]; then
          IFS=',' read -ra FOLDERS <<< "$DATA_FOLDERS"
          for f in "${FOLDERS[@]}"; do
            f="${f//[[:space:]]/}"
            [[ -n "$f" ]] && CMD+=(--data-folders "$f")
          done
        fi

        [[ "$VERBOSE" == "true" ]] && CMD+=(--verbose)

        CMD+=(--workflow-url "$WORKFLOW_URL")

        echo "::group::Running Insomnia"
        OUTPUT_FORMAT_LOWER=$(echo "$OUTPUT_FORMAT" | tr '[:upper:]' '[:lower:]')

        if [[ "$OUTPUT_FORMAT_LOWER" == "json" ]]; then
          STDERR_FILE=$(mktemp)
          MARKDOWN="$("${CMD[@]}" 2>"$STDERR_FILE")"
          EXIT_CODE=$?
          grep '^::error title=' "$STDERR_FILE" >&2 || true
          JSON_TMP="$(grep -v '^::error title=' "$STDERR_FILE" || true)"
          if [[ -n "$JSON_TMP" ]]; then
            if printf '%s' "$JSON_TMP" | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
              JSON_OUTPUT="$JSON_TMP"
            else
              echo "::warning::CLI stderr was not valid JSON; json-output will be empty." >&2
              JSON_OUTPUT=""
            fi
          else
            JSON_OUTPUT=""
          fi
          rm -f "$STDERR_FILE"
        else
          MARKDOWN="$("${CMD[@]}")"
          EXIT_CODE=$?
          JSON_OUTPUT=""
        fi
        echo "::endgroup::"

        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        if [[ -n "$JUNIT_PATH" && -f "$JUNIT_PATH" ]]; then
          echo "junit-path=$JUNIT_PATH" >> "$GITHUB_OUTPUT"
        fi

        write_output() {
          local name="$1" value="$2" delim
          delim=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "${name}<<${delim}"
            echo "$value"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        }

        write_output markdown "$MARKDOWN"

        if [[ -n "$JSON_OUTPUT" ]]; then
          write_output json-output "$JSON_OUTPUT"
        fi

        echo "$MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
        if [[ -n "$REPORT_MD" ]]; then
          printf '%s\n' "$MARKDOWN" > "$REPORT_MD"
        fi
        exit 0

    - name: 📦 Upload report artifact
      if: inputs.upload-report == 'true'
      # upload-artifact v4 is unavailable on some GHES versions; a failure
      # here degrades to a warning instead of breaking the run.
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.report-artifact-name }}
        path: ${{ runner.temp }}/insomnia-run-report/**
        if-no-files-found: warn

    - name: 💬 Post PR Comment
      if: inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      # A failed comment (secondary rate limit, permissions) surfaces as a
      # warning annotation but never breaks the run.
      continue-on-error: true
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        token: ${{ inputs.github-token || github.token }}
        issue-number: ${{ github.event.pull_request.number }}
        body: ${{ steps.run-cli.outputs.markdown }}
        comment-tag: ${{ inputs.comment-tag }}

    - name: ❌ Check for Failures
      if: >-
        ${{ steps.run-cli.outputs.exit-code != '0' &&
          (inputs.fail-on-error == 'true' || steps.run-cli.outputs.exit-code == '2' || steps.run-cli.outputs.exit-code > '1') }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run-cli.outputs.exit-code }}
      run: |
        if [[ "$EXIT_CODE" == "2" ]] || [[ "$EXIT_CODE" -gt 1 ]]; then
          echo "::error::insomnia-run failed with a configuration or runtime error (exit code ${EXIT_CODE}). This is not a test failure — check the step log above for the specific message."
        else
          echo "::error::Insomnia run failed (exit code ${EXIT_CODE}). See the report above for details."
        fi
        exit 1
