version: 2
updates:
# Python dependencies
- package-ecosystem: "uv"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  allow:
  - dependency-type: "all"
  commit-message:
    prefix: "pip"
  labels:
  - "dependencies"
  open-pull-requests-limit: 5

# GitHub Actions workflows
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  commit-message:
    prefix: "gh-actions"
  labels:
  - "dependencies"
  open-pull-requests-limit: 5
