name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "20 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-security:
    if: >
      github.event_name != 'pull_request' ||
      github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          checksum: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220

      - name: Install dependencies
        run: |
          uv build --wheel --out-dir dist
          uv sync --frozen --all-groups --no-build --no-install-project
          requirement="$(python -c 'import hashlib; from pathlib import Path; wheel, = Path("dist").glob("*.whl"); print(f"{wheel.resolve().as_uri()} --hash=sha256:{hashlib.sha256(wheel.read_bytes()).hexdigest()}")')"
          uv pip install --no-build --no-deps --no-index --require-hashes -r <(printf '%s\n' "$requirement")

      - name: Audit Python dependencies
        run: |
          uv export --quiet --frozen --all-groups --no-emit-project --no-editable --no-hashes --output-file /tmp/insomnia-run-pip-audit-requirements.txt
          uv run --frozen --no-sync --no-build pip-audit --strict -r /tmp/insomnia-run-pip-audit-requirements.txt

      - name: Scan Python security issues
        run: uv run --frozen --no-sync --no-build bandit -r src/insomnia_run scripts

      - name: Scan workflows with zizmor
        run: uv run --frozen --no-sync --no-build zizmor --offline .

      - name: Run secret and workflow linters
        run: |
          uv run --frozen --no-sync --no-build pre-commit run gitleaks-ci --hook-stage manual --all-files
          uv run --frozen --no-sync --no-build pre-commit run actionlint --all-files
          uv run --frozen --no-sync --no-build pytest -q -rs tests/test_secret_scanning.py

      - name: Generate SBOM
        run: |
          mkdir -p sbom
          uv run --frozen --no-sync --no-build cyclonedx-py environment .venv --output-reproducible --of JSON -o sbom/cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom
          path: sbom/cyclonedx.json
          retention-days: 14
