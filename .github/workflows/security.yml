name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "20 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-security:
    if: >
      github.event_name != 'pull_request' ||
      github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.11"

      - name: Install dependencies
        run: |
          uv build --wheel --out-dir dist
          uv sync --frozen --all-groups --no-build --no-install-project
          requirement="$(python -c 'import hashlib; from pathlib import Path; wheel, = Path("dist").glob("*.whl"); print(f"{wheel.resolve().as_uri()} --hash=sha256:{hashlib.sha256(wheel.read_bytes()).hexdigest()}")')"
          uv pip install --no-build --no-deps --no-index --require-hashes -r <(printf '%s\n' "$requirement")

      - name: Audit Python dependencies
        run: |
          uv export --quiet --frozen --all-groups --no-emit-project --no-editable --no-hashes --output-file /tmp/insomnia-run-pip-audit-requirements.txt
          uv run --frozen --no-sync --no-build pip-audit --strict -r /tmp/insomnia-run-pip-audit-requirements.txt

      - name: Scan Python security issues
        run: uv run --frozen --no-sync --no-build bandit -r src/insomnia_run

      - name: Scan workflows with zizmor
        run: uv run --frozen --no-sync --no-build zizmor --offline .

      - name: Run secret and workflow linters
        run: |
          uv run --frozen --no-sync --no-build pre-commit run gitleaks --all-files
          uv run --frozen --no-sync --no-build pre-commit run actionlint --all-files

      - name: Generate SBOM
        run: |
          mkdir -p sbom
          uv run --frozen --no-sync --no-build cyclonedx-py environment .venv --output-reproducible --of JSON -o sbom/cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sbom
          path: sbom/cyclonedx.json
          retention-days: 14
