name: E2E Action Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-collection:
    name: Test Collection Command
    if: github.actor != 'dependabot[bot]' && github.actor != 'pre-commit-ci[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Start local API fixture
        run: |
          python3 tests/fixtures/e2e_server.py >"${RUNNER_TEMP}/insomnia-run-e2e-server.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health >/dev/null; then
              exit 0
            fi
            echo "Waiting for local API fixture (attempt ${attempt}/20)"
            sleep 1
          done
          cat "${RUNNER_TEMP}/insomnia-run-e2e-server.log"
          exit 1

      - name: Test passing collection
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/passing_suite.yaml
          environment: Test Environment
          pr-comment: "false"
          upload-artifact: "true"
          artifact-name: insomnia-run-${{ matrix.os }}

      - name: Expose verified Inso as preinstalled
        shell: bash
        run: echo "${RUNNER_TEMP}/insomnia-run-inso/bin" >> "$GITHUB_PATH"

      - name: Test preinstalled Inso with repeated collection requests
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/passing_suite.yaml
          environment: Test Environment
          request-timeout: "30000"
          iteration-count: "2"
          disable-cert-validation: "true"
          verbose: "true"
          pr-comment: "false"

  test-test-command:
    name: Test Test Command
    if: github.actor != 'dependabot[bot]' && github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Start local API fixture
        run: |
          python3 tests/fixtures/e2e_server.py >"${RUNNER_TEMP}/insomnia-run-e2e-server.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/insomnia-run-e2e-server.pid"
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health >/dev/null; then
              exit 0
            fi
            echo "Waiting for local API fixture (attempt ${attempt}/20)"
            sleep 1
          done
          cat "${RUNNER_TEMP}/insomnia-run-e2e-server.log"
          exit 1

      - name: Test passing test suite
        uses: ./
        with:
          command: test
          working-directory: tests/fixtures/passing_test_suite.yaml
          identifier: "Todo API Tests"
          pr-comment: "false"

      - name: Verify current Inso compatibility
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/insomnia-run-compat-venv
          INSOMNIA_RUN_INSO_BINARY: ${{ runner.temp }}/insomnia-run-inso/bin/inso
        run: |
          kill "$(cat "${RUNNER_TEMP}/insomnia-run-e2e-server.pid")"
          uv build --wheel --out-dir "${RUNNER_TEMP}/insomnia-run-compat-wheel"
          uv sync --frozen --no-dev --group test --no-build --no-install-project
          requirement="$(python -c 'import hashlib, os; from pathlib import Path; wheel, = (Path(os.environ["RUNNER_TEMP"]) / "insomnia-run-compat-wheel").glob("*.whl"); print(f"{wheel.resolve().as_uri()} --hash=sha256:{hashlib.sha256(wheel.read_bytes()).hexdigest()}")')"
          uv pip install --no-build --no-deps --no-index --require-hashes --python "${UV_PROJECT_ENVIRONMENT}/bin/python" -r <(printf '%s\n' "$requirement")
          uv run --frozen --no-sync --no-build pytest -q tests/test_inso_compatibility.py

  test-failure-handling:
    name: Test Failure Handling
    if: github.actor != 'dependabot[bot]' && github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Start local API fixture
        run: |
          python3 tests/fixtures/e2e_server.py >"${RUNNER_TEMP}/insomnia-run-e2e-server.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health >/dev/null; then
              exit 0
            fi
            echo "Waiting for local API fixture (attempt ${attempt}/20)"
            sleep 1
          done
          cat "${RUNNER_TEMP}/insomnia-run-e2e-server.log"
          exit 1

      - name: Test mixed results - test suite (should fail)
        id: mixed-test
        continue-on-error: true
        uses: ./
        with:
          command: test
          working-directory: tests/fixtures/mixed_test_suite.yaml
          identifier: "Mixed Results Suite"
          fail-on-error: "true"
          pr-comment: "false"
          upload-artifact: "true"
          artifact-name: insomnia-run-failed-tests

      - name: Verify test suite exit code
        env:
          EXIT_CODE: ${{ steps.mixed-test.outputs.exit-code }}
          STEP_OUTCOME: ${{ steps.mixed-test.outcome }}
        run: |
          if [[ "$STEP_OUTCOME" != "failure" ]]; then
            echo "Expected the action to fail when fail-on-error is true"
            exit 1
          fi
          echo "Exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "1" ]; then
            echo "Expected exit code 1 for failing test suite"
            exit 1
          fi

      - name: Test mixed results - collection (should fail)
        id: mixed-collection
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/mixed_results_suite.yaml
          environment: Test Environment
          fail-on-error: "false"
          pr-comment: "false"

      - name: Verify collection exit code
        env:
          EXIT_CODE: ${{ steps.mixed-collection.outputs.exit-code }}
        run: |
          echo "Exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "1" ]; then
            echo "Expected exit code 1 for failing collection"
            exit 1
          fi

  test-env-vars:
    name: Test Environment Variables
    if: github.actor != 'dependabot[bot]' && github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      API_TOKEN: test_secret_from_env_block
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Start local API fixture
        run: |
          python3 tests/fixtures/e2e_server.py >"${RUNNER_TEMP}/insomnia-run-e2e-server.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health >/dev/null; then
              exit 0
            fi
            echo "Waiting for local API fixture (attempt ${attempt}/20)"
            sleep 1
          done
          cat "${RUNNER_TEMP}/insomnia-run-e2e-server.log"
          exit 1

      - name: Test with env-var input
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/env_var_test.yaml
          environment: Test Environment
          env-var: |
            API_TOKEN=test_secret_from_env_var
          pr-comment: "false"

      - name: Test explicit mapping from runner environment
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/env_var_test.yaml
          environment: Test Environment
          env-var: |
            API_TOKEN=${{ env.API_TOKEN }}
          pr-comment: "false"

  test-outputs:
    name: Test Action Outputs
    if: github.actor != 'dependabot[bot]' && github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Start local API fixture
        run: |
          python3 tests/fixtures/e2e_server.py >"${RUNNER_TEMP}/insomnia-run-e2e-server.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health >/dev/null; then
              exit 0
            fi
            echo "Waiting for local API fixture (attempt ${attempt}/20)"
            sleep 1
          done
          cat "${RUNNER_TEMP}/insomnia-run-e2e-server.log"
          exit 1

      - name: Run collection
        id: run
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/passing_suite.yaml
          environment: Test Environment
          pr-comment: "false"
          output-format: json

      - name: Verify markdown output
        env:
          MARKDOWN_OUTPUT: ${{ steps.run.outputs.markdown }}
        run: |
          echo "Markdown output:"
          echo "$MARKDOWN_OUTPUT"
          if [[ ! "$MARKDOWN_OUTPUT" =~ "Insomnia Collection" ]]; then
            echo "Expected markdown to contain 'Insomnia Collection'"
            exit 1
          fi

      - name: Verify JSON output
        env:
          JSON_OUTPUT: ${{ steps.run.outputs.json-output }}
        run: |
          echo "JSON output length: ${#JSON_OUTPUT}"
          # Check that JSON output exists
          if [[ -z "$JSON_OUTPUT" ]]; then
            echo "::error::JSON output was expected but found empty!"
            exit 1
          fi

          # Validate JSON format
          if ! printf '%s' "$JSON_OUTPUT" | jq empty; then
            echo "::error::JSON output is not valid JSON!"
            exit 1
          fi
          printf '%s' "$JSON_OUTPUT" | jq -e '
            (.results | length) == 3 and
            ([.results[].id] == [1, 2, 3]) and
            .plan_start == 1 and .plan_end == 3 and
            (has("raw_output") | not)
          '

      - name: Verify JUnit output
        env:
          JUNIT_FILE: ${{ steps.run.outputs.junit-file }}
        run: |
          echo "JUnit file: $JUNIT_FILE"
          if [[ -z "$JUNIT_FILE" || ! -f "$JUNIT_FILE" ]]; then
            echo "::error::JUnit file was expected but not found"
            exit 1
          fi
          if ! grep -q '<testsuite name="Insomnia Collection"' "$JUNIT_FILE"; then
            echo "::error::JUnit file does not contain the expected test suite"
            exit 1
          fi

      - name: Verify exit code output
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        run: |
          echo "Exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Expected exit code 0 for passing tests"
            exit 1
          fi
