name: E2E Action Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collection-run:
    name: Collection run
    if: github.actor != 'dependabot[bot]' && github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start local mock API
        env:
          MOCK_PORT: "8081"
        run: |
          set -euo pipefail
          python3 tests/mock_api.py --port "$MOCK_PORT" > "${RUNNER_TEMP}/mock-api.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_PORT}/todos/1" > /dev/null; then
              echo "Mock API ready on port ${MOCK_PORT}"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Mock API failed to start"
          cat "${RUNNER_TEMP}/mock-api.log" || true
          exit 1

      - name: Test passing collection
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/passing_suite.yaml
          environment: Test Environment
          pr-comment: "false"

      - name: Test collection with all options
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/passing_suite.yaml
          environment: Test Environment
          request-timeout: "30000"
          disable-cert-validation: "true"
          verbose: "true"
          pr-comment: "false"

  test-run:
    name: Test suite run
    if: github.actor != 'dependabot[bot]' && github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start local mock API
        env:
          MOCK_PORT: "8081"
        run: |
          set -euo pipefail
          python3 tests/mock_api.py --port "$MOCK_PORT" > "${RUNNER_TEMP}/mock-api.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_PORT}/todos/1" > /dev/null; then
              echo "Mock API ready on port ${MOCK_PORT}"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Mock API failed to start"
          cat "${RUNNER_TEMP}/mock-api.log" || true
          exit 1

      - name: Test passing test suite
        uses: ./
        with:
          command: test
          working-directory: tests/fixtures/passing_test_suite.yaml
          identifier: "Todo API Tests"
          pr-comment: "false"

  failure-handling:
    name: Failure handling
    if: github.actor != 'dependabot[bot]' && github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start local mock API
        env:
          MOCK_PORT: "8081"
        run: |
          set -euo pipefail
          python3 tests/mock_api.py --port "$MOCK_PORT" > "${RUNNER_TEMP}/mock-api.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_PORT}/todos/1" > /dev/null; then
              echo "Mock API ready on port ${MOCK_PORT}"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Mock API failed to start"
          cat "${RUNNER_TEMP}/mock-api.log" || true
          exit 1

      - name: Run failing test suite (fail-on-error false)
        id: failing-suite
        uses: ./
        with:
          command: test
          working-directory: tests/fixtures/mixed_test_suite.yaml
          identifier: "Mixed Results Suite"
          fail-on-error: "false"
          pr-comment: "false"

      - name: Assert failing test suite exit code is 1
        env:
          EXIT_CODE: ${{ steps.failing-suite.outputs.exit-code }}
        run: |
          set -euo pipefail
          if [[ "$EXIT_CODE" != "1" ]]; then
            echo "::error::Expected exit code 1 for failing test suite, got '${EXIT_CODE}'"
            exit 1
          fi

      - name: Run failing collection (fail-on-error false)
        id: failing-collection
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/mixed_results_suite.yaml
          environment: Test Environment
          fail-on-error: "false"
          pr-comment: "false"

      - name: Assert failing collection exit code is 1
        env:
          EXIT_CODE: ${{ steps.failing-collection.outputs.exit-code }}
        run: |
          set -euo pipefail
          if [[ "$EXIT_CODE" != "1" ]]; then
            echo "::error::Expected exit code 1 for failing collection, got '${EXIT_CODE}'"
            exit 1
          fi

      - name: Run failing collection (fail-on-error true)
        id: fail-gate
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/mixed_results_suite.yaml
          environment: Test Environment
          fail-on-error: "true"
          pr-comment: "false"
        continue-on-error: true

      - name: Assert fail-on-error fails the step
        env:
          OUTCOME: ${{ steps.fail-gate.outcome }}
          EXIT_CODE: ${{ steps.fail-gate.outputs.exit-code }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::Expected the step outcome to be 'failure' with fail-on-error: true, got '${OUTCOME}'"
            exit 1
          fi
          if [[ "$EXIT_CODE" != "1" ]]; then
            echo "::error::Expected exit code 1 with fail-on-error: true, got '${EXIT_CODE}'"
            exit 1
          fi

  annotations:
    # Validates CLI-level annotation emission (real inso + real CLI in an
    # Actions runner). The composite steps are covered by the other jobs.
    name: Failure annotations
    if: github.actor != 'dependabot[bot]' && github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.6"
          enable-cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install inso
        env:
          INSO_VERSION: "13.2.0"
        run: |
          set -euo pipefail
          curl -sSL --fail --retry 3 --max-time 180 \
            -o "${RUNNER_TEMP}/inso.tar.xz" \
            "https://github.com/Kong/insomnia/releases/download/core%40${INSO_VERSION}/inso-linux-x64-${INSO_VERSION}.tar.xz"
          tar -xJf "${RUNNER_TEMP}/inso.tar.xz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Start local mock API
        env:
          MOCK_PORT: "8081"
        run: |
          set -euo pipefail
          python3 tests/mock_api.py --port "$MOCK_PORT" > "${RUNNER_TEMP}/mock-api.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_PORT}/todos/1" > /dev/null; then
              echo "Mock API ready on port ${MOCK_PORT}"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Mock API failed to start"
          cat "${RUNNER_TEMP}/mock-api.log" || true
          exit 1

      - name: Install insomnia-run from source
        run: uv sync --no-dev --locked --no-build --no-binary-package insomnia-run

      - name: Run failing suite directly and capture stderr
        id: run
        env:
          GITHUB_ACTIONS: "true"
          INSO_TELEMETRY_DISABLED: "1"
        run: |
          set +e
          uv run insomnia-run run-test \
            -w tests/fixtures/mixed_test_suite.yaml \
            --identifier "Mixed Results Suite" \
            > /dev/null 2> "${RUNNER_TEMP}/cli-stderr.txt"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Assert ::error annotations were emitted
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit }}
          STDERR_FILE: ${{ runner.temp }}/cli-stderr.txt
        run: |
          set -euo pipefail
          if [[ "$EXIT_CODE" != "1" ]]; then
            echo "::error::Expected exit code 1, got '${EXIT_CODE}'"
            exit 1
          fi
          if ! grep -q '^::error title=' "$STDERR_FILE"; then
            echo "::error::Expected at least one '::error title=' annotation on stderr"
            cat "$STDERR_FILE"
            exit 1
          fi
          grep '^::error title=' "$STDERR_FILE" | head -3

  env-vars:
    name: Environment variables
    if: github.actor != 'dependabot[bot]' && github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start local mock API
        env:
          MOCK_PORT: "8081"
        run: |
          set -euo pipefail
          python3 tests/mock_api.py --port "$MOCK_PORT" > "${RUNNER_TEMP}/mock-api.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_PORT}/headers" > /dev/null; then
              echo "Mock API ready on port ${MOCK_PORT}"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Mock API failed to start"
          cat "${RUNNER_TEMP}/mock-api.log" || true
          exit 1

      - name: Test with env-var input
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/env_var_test.yaml
          environment: Test Environment
          env-var: |
            API_TOKEN=test_secret_from_env_var
          pr-comment: "false"

      - name: Test with env block
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/env_var_test.yaml
          environment: Test Environment
          pr-comment: "false"
        env:
          API_TOKEN: test_secret_from_env_block

  outputs-junit:
    name: Outputs and JUnit report
    if: github.actor != 'dependabot[bot]' && github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start local mock API
        env:
          MOCK_PORT: "8081"
        run: |
          set -euo pipefail
          python3 tests/mock_api.py --port "$MOCK_PORT" > "${RUNNER_TEMP}/mock-api.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_PORT}/todos/1" > /dev/null; then
              echo "Mock API ready on port ${MOCK_PORT}"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Mock API failed to start"
          cat "${RUNNER_TEMP}/mock-api.log" || true
          exit 1

      - name: Run failing collection with JUnit output and report artifact
        id: failing
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/mixed_results_suite.yaml
          environment: Test Environment
          fail-on-error: "false"
          pr-comment: "false"
          junit-output: ${{ runner.temp }}/insomnia-run-junit.xml
          upload-report: "true"
          report-artifact-name: insomnia-run-report

      - name: Assert failing-run outputs and JUnit contents
        env:
          EXIT_CODE: ${{ steps.failing.outputs.exit-code }}
          JUNIT_PATH: ${{ steps.failing.outputs.junit-path }}
          MARKDOWN: ${{ steps.failing.outputs.markdown }}
        run: |
          set -euo pipefail
          if [[ "$EXIT_CODE" != "1" ]]; then
            echo "::error::Expected exit code 1, got '${EXIT_CODE}'"
            exit 1
          fi
          if [[ -z "$JUNIT_PATH" ]]; then
            echo "::error::junit-path output was not set"
            exit 1
          fi
          if [[ ! -f "$JUNIT_PATH" ]]; then
            echo "::error::JUnit file does not exist at '${JUNIT_PATH}'"
            exit 1
          fi
          if ! grep -q '<failure' "$JUNIT_PATH"; then
            echo "::error::JUnit report for a failing fixture contains no <failure> entries"
            exit 1
          fi
          if [[ -z "$MARKDOWN" ]]; then
            echo "::error::markdown output was empty"
            exit 1
          fi
          echo "JUnit report: ${JUNIT_PATH}"
          grep -c '<failure' "$JUNIT_PATH"

      - name: Run passing collection with JUnit output
        id: passing
        uses: ./
        with:
          command: collection
          working-directory: tests/fixtures/passing_suite.yaml
          environment: Test Environment
          pr-comment: "false"
          junit-output: ${{ runner.temp }}/insomnia-run-passing.xml

      - name: Assert report artifact staging files exist
        env:
          STAGE: ${{ runner.temp }}/insomnia-run-report
        run: |
          set -euo pipefail
          for f in raw-output.txt report.md; do
            if [[ ! -s "${STAGE}/${f}" ]]; then
              echo "::error::Report artifact file ${STAGE}/${f} is missing or empty"
              exit 1
            fi
          done
          echo "Staged report files:"
          ls -la "${STAGE}"

      - name: Assert passing-run JUnit has no failures
        env:
          JUNIT_PATH: ${{ steps.passing.outputs.junit-path }}
        run: |
          set -euo pipefail
          if [[ -z "$JUNIT_PATH" ]]; then
            echo "::error::junit-path output was not set for the passing run"
            exit 1
          fi
          if [[ ! -f "$JUNIT_PATH" ]]; then
            echo "::error::JUnit file does not exist at '${JUNIT_PATH}'"
            exit 1
          fi
          if grep -q '<failure' "$JUNIT_PATH"; then
            echo "::error::JUnit report for a passing fixture contains <failure> entries"
            exit 1
          fi

  stress:
    name: Stress (300 requests)
    if: github.actor != 'dependabot[bot]' && github.actor != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start local mock API
        env:
          MOCK_PORT: "8081"
        run: |
          set -euo pipefail
          python3 tests/mock_api.py --port "$MOCK_PORT" > "${RUNNER_TEMP}/mock-api.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_PORT}/todos/1" > /dev/null; then
              echo "Mock API ready on port ${MOCK_PORT}"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Mock API failed to start"
          cat "${RUNNER_TEMP}/mock-api.log" || true
          exit 1

      - name: Generate 300-request collection
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/stress"
          python3 << 'PY'
          import os
          import pathlib

          runner_temp = os.environ.get("RUNNER_TEMP", "/tmp")
          out_path = pathlib.Path(runner_temp) / "stress" / "collection.yaml"

          lines = []
          lines.append("type: collection.insomnia.rest/5.0")
          lines.append("name: Stress Test - 300 Requests")
          lines.append("meta:")
          lines.append("  id: wrk_stress_001")
          lines.append("  created: 1735000000000")
          lines.append("  modified: 1735000000000")
          lines.append('  description: "Stress fixture - 300 requests for cap validation"')
          lines.append("collection:")
          for i in range(1, 301):
              idx = f"{i:03d}"
              sort_key = -i
              lines.append(f"  - url: http://127.0.0.1:8081/todos/1")
              lines.append(f"    name: Stress request {idx}")
              lines.append(f"    meta:")
              lines.append(f"      id: req_stress_{idx}")
              lines.append(f"      created: 1735000000{idx}")
              lines.append(f"      modified: 1735000000{idx}")
              lines.append(f"      isPrivate: false")
              lines.append(f'      description: "Stress request {idx}"')
              lines.append(f"      sortKey: {sort_key}")
              lines.append(f"    method: GET")
              lines.append(f"    headers:")
              lines.append(f"      - name: User-Agent")
              lines.append(f"        value: insomnia-run/tests")
              lines.append(f"    scripts:")
              lines.append(f"      afterResponse: |")
              lines.append(f"        insomnia.test('Status code is 200', () => {{")
              lines.append(f"            insomnia.expect(200).to.eql(200);")
              lines.append(f"        }});")
              lines.append(f"    settings:")
              lines.append(f"      renderRequestBody: true")
              lines.append(f"      encodeUrl: true")
              lines.append(f"      followRedirects: global")
              lines.append(f"      cookies:")
              lines.append(f"        send: true")
              lines.append(f"        store: true")
              lines.append(f"      rebuildPath: true")
              lines.append("")
          lines.append("cookieJar:")
          lines.append("  name: Default Jar")
          lines.append("  meta:")
          lines.append("    id: jar_stress_001")
          lines.append("    created: 1735000000000")
          lines.append("    modified: 1735000000000")
          lines.append("environments:")
          lines.append("  name: Test Environment")
          lines.append("  data: {}")
          lines.append("  meta:")
          lines.append("    id: env_stress_001")
          lines.append("    created: 1735000000000")
          lines.append("    modified: 1735000000000")
          lines.append("    isPrivate: false")
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Wrote {out_path} with 300 requests")
          PY
          echo "Generated collection:"
          ls -lh "${RUNNER_TEMP}/stress/collection.yaml"
          wc -l "${RUNNER_TEMP}/stress/collection.yaml"

      - name: Run stress collection
        id: stress-run
        uses: ./
        with:
          command: collection
          working-directory: ${{ runner.temp }}/stress/collection.yaml
          environment: Test Environment
          pr-comment: "false"
          junit-output: ${{ runner.temp }}/stress-junit.xml
          fail-on-error: "false"

      - name: Assert 50-result cap in markdown
        env:
          MARKDOWN: ${{ steps.stress-run.outputs.markdown }}
        run: |
          set -euo pipefail
          if [[ -z "$MARKDOWN" ]]; then
            echo "::error::markdown output was empty"
            exit 1
          fi
          if ! printf '%s' "$MARKDOWN" | grep -q "more results"; then
            echo "::error::Expected 50-result cap indicator ('more results') not found in markdown"
            printf '%s\n' "$MARKDOWN" | head -n 200
            exit 1
          fi
          if ! printf '%s' "$MARKDOWN" | grep -q "250 more results"; then
            echo "::error::Expected '250 more results' (300-50 cap) not found in markdown"
            printf '%s\n' "$MARKDOWN" | grep -n "more results" || true
            exit 1
          fi
          echo "50-result cap verified (300 -> 50 + 250 hidden)"

      - name: Assert comment-size safety
        env:
          MARKDOWN: ${{ steps.stress-run.outputs.markdown }}
        run: |
          set -euo pipefail
          bytes=$(printf '%s' "$MARKDOWN" | wc -c)
          echo "Markdown bytes: $bytes"
          if [[ "$bytes" -gt 65536 ]]; then
            echo "::error::Markdown exceeds GitHub comment limit (65536 bytes): $bytes"
            exit 1
          fi
          echo "Comment-size safety verified: $bytes bytes <= 65536"

      - name: Assert JUnit validity
        env:
          JUNIT_PATH: ${{ steps.stress-run.outputs.junit-path }}
        run: |
          set -euo pipefail
          if [[ -z "$JUNIT_PATH" ]]; then
            echo "::error::junit-path output was not set"
            exit 1
          fi
          if [[ ! -f "$JUNIT_PATH" ]]; then
            echo "::error::JUnit file does not exist at '${JUNIT_PATH}'"
            exit 1
          fi
          count=$(grep -c '<testcase' "$JUNIT_PATH" || true)
          echo "testcase count: $count"
          if [[ "$count" != "300" ]]; then
            echo "::error::Expected 300 <testcase> entries, got $count"
            exit 1
          fi
          python3 -c 'import xml.etree.ElementTree as ET, sys; ET.parse(sys.argv[1]); print("XML well-formed")' "$JUNIT_PATH"
          echo "JUnit validity verified (300 cases, well-formed XML)"
