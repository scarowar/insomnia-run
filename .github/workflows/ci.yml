name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.11"

      - name: Install dependencies
        run: |
          uv build --wheel --out-dir dist
          if [[ "$UV_PYTHON" == "3.15" ]]; then
            # PyYAML 6.0.3 has no 3.15 wheel. Only this test environment permits locked source builds.
            uv sync --frozen --no-dev --group test --no-install-project # NOSONAR(githubactions:S8541)
          else
            uv sync --frozen --no-dev --group test --no-build --no-install-project
          fi
          uv pip install --no-build --no-deps --no-index dist/*.whl

      - name: Run tests
        run: uv run --frozen --no-sync --no-build pytest -v --tb=short --cov=insomnia_run --cov-report=term-missing --cov-fail-under=95

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.11"

      - name: Install dependencies
        run: |
          uv build --wheel --out-dir dist
          uv sync --frozen --dev --no-build --no-install-project
          uv pip install --no-build --no-deps --no-index dist/*.whl

      - name: Run ruff check
        run: uv run --frozen --no-sync --no-build ruff check src/ tests/ scripts/

      - name: Run ruff format check
        run: uv run --frozen --no-sync --no-build ruff format --check src/ tests/ scripts/

      - name: Run type checking
        run: uv run --frozen --no-sync --no-build mypy src/insomnia_run --ignore-missing-imports --cache-dir=/tmp/mypy-cache

      - name: Build documentation
        run: uv run --frozen --no-sync --no-build zensical build
