ci:
  autoupdate_schedule: weekly
  autofix_commit_msg: "style: apply pre-commit fixes"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  skip:
  - gitleaks
  - bandit
  - actionlint
  - gitlint
  - pip-audit
  - zizmor

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-json

- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.14
  hooks:
  - id: ruff-check
    args: [ --fix ]
  - id: ruff-format

- repo: https://github.com/PyCQA/bandit
  rev: 1.9.4
  hooks:
  - id: bandit
    args: [ -r, src/insomnia_run ]
    pass_filenames: false

- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint

- repo: https://github.com/jorisroovers/gitlint
  rev: v0.19.1
  hooks:
  - id: gitlint

- repo: local
  hooks:
  - id: pip-audit
    name: pip-audit
    entry: bash -c 'uv export --quiet --frozen --all-groups --no-emit-project --no-editable --no-hashes --output-file /tmp/insomnia-run-pip-audit-requirements.txt && uv run pip-audit --strict -r /tmp/insomnia-run-pip-audit-requirements.txt'
    language: system
    pass_filenames: false

  - id: zizmor
    name: zizmor
    entry: uv run zizmor --offline .
    language: system
    pass_filenames: false
